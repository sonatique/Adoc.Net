name: CI

on:
  push:
    branches: [main, WIP]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup .NET 8 (for cross-TFM consistency tests)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (both TFMs)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'

      - name: Pack (NuGet + symbols)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build -c Release -o artifacts/

      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest'
        run: |
          for pkg in artifacts/*.nupkg; do
            echo "=== $(basename $pkg) ==="
            unzip -l "$pkg" | grep -E "lib/(net|netstandard)" | awk '{print $4}'
          done

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Tool install test
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install -g AdocNet.Tool --add-source artifacts/ --version $(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          echo '= Test' | adocnet /dev/stdin || true
          dotnet tool uninstall -g AdocNet.Tool
